<ion-header>
  <ion-toolbar>
    <ion-title>Encaissement rapide</ion-title>
  </ion-toolbar>

  <ion-toolbar>
    <ion-searchbar
      [(ngModel)]="q"
      (ionInput)="onSearchChange()"
      placeholder="Rechercher un produit…"
      show-clear-button="focus"
      animated="true">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen="true">
  <ion-list lines="full">
    <ion-item *ngIf="loading">
      <ion-spinner slot="start" name="crescent"></ion-spinner>
      <ion-label>Recherche en cours…</ion-label>
    </ion-item>

    <ion-item button detail="false" *ngFor="let p of suggestions" (click)="addToCart(p)">
      <ion-avatar slot="start"><img [src]="p.images?.[0]?.url || placeholderImg" alt="img"/></ion-avatar>
      <ion-label>
        <h3>{{ p.name }}</h3>
        <p>{{ p.price | number:'1.0-0' }} {{ p.currency }}</p>
      </ion-label>
      <ion-button fill="clear" slot="end" aria-label="Ajouter">
        <ion-icon name="add-outline"></ion-icon>
      </ion-button>
    </ion-item>

    <ion-item *ngIf="!loading && suggestions.length===0">
      <ion-label>Aucun résultat</ion-label>
    </ion-item>
  </ion-list>
</ion-content>

<!-- Pill flottante au-dessus de la tabbar -->
<ion-fab slot="fixed" vertical="bottom" horizontal="end" *ngIf="cart.length">
  <ion-fab-button class="cart-pill" (click)="openCartSheet()" aria-label="Ouvrir le panier">
    <ion-icon name="cart-outline"></ion-icon>
    <span class="lbl">{{ total | number:'1.0-0' }} {{ currency }} • {{ cartCount }}</span>
    <ion-badge id="cartBadge" color="light">{{ cartCount }}</ion-badge>
  </ion-fab-button>

  <!-- +1 animé -->
  <div class="plus-one" *ngIf="addedFlash">+1</div>
</ion-fab>
