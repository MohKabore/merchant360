<ion-header>
  <ion-toolbar>
    <ion-title>Historique des ventes</ion-title>
    <ion-buttons slot="end">
      <ion-button color="danger" (click)="clearAll()">
        <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen="true">
  <ion-list lines="full">
    <ion-item *ngIf="loading">
      <ion-spinner slot="start" name="crescent"></ion-spinner>
      <ion-label>Chargement…</ion-label>
    </ion-item>

    <ion-item button detail="true" *ngFor="let s of items" (click)="openReceipt(s)">
      <ion-icon name="receipt-outline" slot="start"></ion-icon>
      <ion-label>
        <h3>#{{ s.id }} — {{ s.total | number:'1.0-0' }} {{ s.currency }}</h3>
        <p>{{ s.createdAt | date:'medium' }} • {{ s.paymentMethod }}</p>
      </ion-label>
      <ion-badge color="light">{{ s.lines.length }} art.</ion-badge>
    </ion-item>

    <ion-item *ngIf="!loading && !items.length">
      <ion-label>Aucune vente enregistrée</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
